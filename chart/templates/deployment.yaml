apiVersion: apps/v1
kind: Deployment
metadata:
  name: condor-pagos
  labels:
    app: condor-pagos
    app.kubernetes.io/name: pagos
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: condor-pagos
  template:
    metadata:
      labels:
        app: condor-pagos
        app.kubernetes.io/name: pagos
    spec:
      containers:
        - name: condor-pagos
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: {{ .Values.env.DATABASE_URL | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
